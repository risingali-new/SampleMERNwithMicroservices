apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: {{ .Values.namespace }}
  labels:
    app: hello-service
spec:
  replicas: {{ .Values.replicas.hello }}
  selector:
    matchLabels:
      app: hello-service
  template:
    metadata:
      labels:
        app: hello-service
    spec:
      containers:
        - name: hello-service
          image: "{{ .Values.images.hello.repository }}:{{ .Values.images.hello.tag }}"
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: hello-service
  ports:
    - port: 3001
      targetPort: 3001
