apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: {{ .Values.namespace }}
  labels:
    app: profile-service
spec:
  replicas: {{ .Values.replicas.profile }}
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
        - name: profile-service
          image: "{{ .Values.images.profile.repository }}:{{ .Values.images.profile.tag }}"
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3002"
            - name: MONGO_URL
              value: "mongodb://mongodb:27017/mern"
          ports:
            - containerPort: 3002
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 40
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: profile-service
  ports:
    - port: 3002
      targetPort: 3002
